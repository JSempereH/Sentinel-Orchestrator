name: Docs

# Builds the MkDocs site and publishes it on GitHub Pages
# (https://jsempereh.github.io/citycube/) on every push to main.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Build the site
        # The site needs only MkDocs and its theme, not the package or its extras.
        # MkDocs 2 drops the theme and plugin system the site relies on.
        run: uv run --no-project --with "mkdocs>=1.6,<2" --with "mkdocs-material>=9.5.0" mkdocs build --strict --site-dir site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
