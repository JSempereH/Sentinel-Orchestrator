name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # `sar`/`s1ard` deliberately excluded: they pull in pyrosar, which
      # hard-depends on building psycopg2 from source (needs libpq-dev/
      # pg_config on PATH) for a scene-catalog feature nothing here uses -
      # see worker/Dockerfile's and worker/README.md's identical exclusion.
      # Without `ml`/`landsat`/`ecostress`/`cdse` here, every GWR, STARFM
      # (ml-gated), Landsat and ECOSTRESS test just reports "skipped", not
      # "passed" - this pipeline was staying green without actually
      # exercising most of the library.
      - name: Install dependencies
        run: uv sync --extra dev --extra auxiliary --extra optical --extra ml --extra landsat --extra ecostress --extra cdse --extra hyp3 --extra cloud --extra odc --extra geo

      - name: Lint (ruff)
        run: uv run ruff check .

      # Checked clean (0 errors across 46 source files) before making this
      # blocking - see docs/roadmap.md. ignore_missing_imports is set in
      # pyproject.toml's [tool.mypy] since optional extras (rasterio, scipy,
      # planetary_computer, eodag, ...) don't all ship type stubs.
      - name: Type check (mypy)
        run: uv run mypy src/citycube

      - name: Test
        run: uv run pytest -q

      - name: Build package
        run: uv build

  worker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # Installs exactly what the container installs (requirements.lock),
      # so a lock that no longer resolves or imports fails here, not in a
      # deployment. worker/tests/ never runs a real analysis.
      - name: Install worker dependencies
        working-directory: worker
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r requirements.lock -r requirements-dev.txt
          uv pip install --python .venv --no-deps -e ..

      # `python -m pytest`, not the bare `.venv/bin/pytest` binary - the
      # latter does not insert the current directory onto sys.path, so
      # `worker/tests/conftest.py`'s `from app import jobs` fails with
      # ModuleNotFoundError (confirmed locally, not a CI-only quirk).
      - name: Test
        working-directory: worker
        run: .venv/bin/python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (type-checks with tsc)
        run: npm run build
